<!doctype html>
<html lang='en'>
  <head>
    <title>Find your Zodiac sign!</title>
    <meta charset='utf-8' />
    <meta name ="Description" content="Discover your zodiac sign based on your birthday">

    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
 
      
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <header>
    <h1> What is my Zodiac Sign?</h1>

      <p> Discover your zodiac sign based on your birthday!</p>
      </header>


    <main>
      <section>
        <h2> Enter your date of birth</h2>
        <form id="zodiacForm">
          <label for="fname"> First Name: </label>
          <input type="text" id="fname" name="firstName" required>
          <br>
          <label for="birthday"> Birthday:  </label>
          <input type="date" id="birthday" name="birthday" required>
          <button type="submit"> Find my Zodiac Sign</button>
          </form>

          <div id = "result"></div> 
          <h2> Your Saved Zodiac Records</h2>
          <div id = "savedRecords"> </div>
          </section>
          </main>
  
  </body>
</html>
